<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>STEM Library Test</title>
    <!-- 1. تحميل مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .hidden { display: none; }
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 10px; max-width: 400px; }
        button { padding: 10px; margin-top: 10px; cursor: pointer; }
        input { padding: 10px; margin-top: 5px; width: 90%; display: block; }
    </style>
</head>
<body>

    <h2>اختبار مكتبة STEM 🚀</h2>
    <h4 id="statusMessage" style="color: blue;">جاري فحص الأزرار...</h4>

    <!-- صندوق تسجيل الدخول -->
    <div id="loginBox" class="box">
        <h3>تسجيل الدخول</h3>
        <input type="email" id="emailInput" placeholder="student@stemdamietta.moe.edu.eg">
        <input type="password" id="passInput" placeholder="Password">
        <button id="loginBtn">دخول للمكتبة</button>
    </div>

    <!-- لوحة المكتبة (تكون مخفية في البداية) -->
    <div id="libraryBox" class="box hidden">
        <h3 style="color: green;">🎉 أهلاً بك في المكتبة! تم الدخول بنجاح.</h3>
        <button id="logoutBtn">تسجيل الخروج</button>
    </div>

    <!-- 2. الكود البرمجي (وضعناه في النهاية لضمان عمل الأزرار) -->
    <script>
        // تغيير النص لتأكيد أن الجافاسكريبت يعمل
        document.getElementById('statusMessage').innerText = "✅ الجافاسكريبت يعمل والأزرار جاهزة!";
        document.getElementById('statusMessage').style.color = "green";

        // الاتصال بقاعدة البيانات
        const supabaseUrl = 'https://lqnqqzsjlntjkxqoxkyp.supabase.co';
        const supabaseKey = 'sb_publishable_yQj1w7ZDSr1EmndXpta6Bw_nPNxaNs0';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const allowedDomain = '@stemdamietta.moe.edu.eg';

        // برمجة زر الدخول
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passInput').value;

            if (!email.endsWith(allowedDomain)) {
                alert('عذراً! استخدم إيميل مدرسة STEM.');
                return;
            }

            document.getElementById('loginBtn').innerText = 'جاري الدخول...';

            const { error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                alert('خطأ: الإيميل أو الباسورد غير صحيح! أو الحساب غير موجود.');
                document.getElementById('loginBtn').innerText = 'دخول للمكتبة';
            }
        });

        // برمجة زر الخروج
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
        });

        // مراقبة حالة الدخول (لإخفاء وإظهار المكتبة)
        supabase.auth.onAuthStateChange((event, session) => {
            if (session) {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('libraryBox').classList.remove('hidden');
            } else {
                document.getElementById('loginBox').classList.remove('hidden');
                document.getElementById('libraryBox').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
